<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Chance cards | Darwin 1942</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet" />
    <script src="../assets/chance/cards.js"></script>
    <style>
      :root { --heading-font: "Futura", "Avenir Next", "Trebuchet MS", Arial, sans-serif; --ink: #222; --muted: #5f6b64; }
      body { margin: 0; background: #ceebcd; color: var(--ink); font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
      header { padding: 26px 28px 8px; }
      header h1 { margin: 0 0 4px; font-family: var(--heading-font); font-size: 24px; }
      header p { margin: 0; color: var(--muted); font-size: 14px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 26px; padding: 22px 28px 60px; }
      .num { font-family: var(--heading-font); font-size: 12px; color: var(--muted); margin: 0 0 6px 4px; }
      /* The same card rules as the worksheet, minus the fixed positioning. */
      .toast {
        position: relative;
        width: 440px; max-width: calc(100vw - 24px); min-height: 220px;
        background: #f58a4e; color: #1a1a1a; border: 2px solid #1a1a1a; border-radius: 10px;
        box-shadow: 6px 6px 0 rgba(26,26,26,0.35); padding: 14px 18px 18px; 
        opacity: 1;
        display: grid; grid-template-columns: 170px 1fr; grid-template-rows: auto 1fr; column-gap: 14px; row-gap: 6px;
        text-align: left;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .toast .ch-title { grid-column: 1 / -1; font-family: "Kaushan Script", "Brush Script MT", cursive; font-size: 30px; line-height: 1; letter-spacing: 0.5px; }
      .toast .ch-img { grid-column: 1; align-self: center; justify-self: center; width: 170px; height: 150px; object-fit: contain; }
      .toast .ch-text { grid-column: 2; align-self: center; font-family: var(--heading-font); font-weight: 700; font-size: 17px; line-height: 1.25; text-transform: uppercase; letter-spacing: 0.3px; }
      .toast .ch-text small { display: block; text-transform: none; font-family: inherit; font-weight: 400; font-size: 13px; margin-top: 8px; line-height: 1.35; }
      .toast .ch-foot { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-family: var(--heading-font); font-weight: 700; font-size: 10px; letter-spacing: 0.4px; text-transform: uppercase; opacity: 0.85; }
            .toast, .toast.show { transform: none; width: 100%; max-width: 100%; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <header>
      <h1>Chance cards</h1>
      <p>Every card in the deck, dealt one at a time after each saved call. Edit them in <code>calls/assets/chance/cards.js</code>.</p>
    </header>
    <div class="grid" id="grid"></div>
    <script>
      var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
      document.getElementById("grid").innerHTML = (window.CHEST_CARDS || []).map(function (c, i) {
        return '<div><p class="num">' + (i + 1) + " of " + window.CHEST_CARDS.length + " &middot; " + esc(c.img) + '</p>' +
          '<div class="toast show"><span class="ch-title">Chance</span>' +
          '<img class="ch-img" src="../assets/chance/' + esc(c.img) + '.png" alt="">' +
          '<div class="ch-text">' + esc(c.t) + "</div></div></div>";
      }).join("");
    </script>
  </body>
</html>
