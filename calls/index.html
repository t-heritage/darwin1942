<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Call Worksheet | Darwin 1942</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root{
    --sky-blue:#2b8cc4;
    --red:#c8102e;
    --white:#ffffff;
    --dark:#0b1c2c;
    --card-dark:#081524;
    --line:rgba(255,255,255,0.12);
    --muted:#a8c4d8;
    --heading-font:Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:var(--dark);
    color:var(--white);
    font-family:Arial,Helvetica,sans-serif;
    font-size:15px;
    line-height:1.6;
    min-height:100vh;
  }
  h1,h2,h3,h4{font-family:var(--heading-font);font-weight:700;margin:0;letter-spacing:normal;}
  a{color:var(--sky-blue);}
  button{font-family:var(--heading-font);font-weight:700;letter-spacing:0.3px;cursor:pointer;border:0;}
  button:disabled{opacity:0.5;cursor:not-allowed;}

  /* ---------------------------------------------------------------- shell */
  #view-work{display:flex;flex-direction:column;height:100%;}
  #work-body,#admin-body{flex:1 1 auto;min-height:0;overflow:hidden;}
  #admin-body{overflow-y:auto;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 20px;background:var(--card-dark);border-bottom:1px solid var(--line);
    flex:0 0 auto;z-index:10;flex-wrap:wrap;
  }
  .topbar h1{font-size:18px;}
  .topbar .who{color:var(--muted);font-size:14px;}
  .counters{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;}
  .counters b{color:var(--white);font-family:var(--heading-font);font-weight:700;font-size:17px;display:block;line-height:1;}
  .linkbtn{background:none;color:var(--muted);text-decoration:underline;font-size:13px;font-family:inherit;letter-spacing:0;padding:0;}

  /* ------------------------------------------------------------ auth card */
  .auth-wrap{display:flex;align-items:center;justify-content:center;height:100%;overflow-y:auto;padding:24px;}
  .auth{width:100%;max-width:400px;background:var(--card-dark);border:1px solid var(--line);padding:32px;}
  .auth h1{font-size:25px;margin-bottom:6px;}
  .auth p.sub{color:var(--muted);margin:0 0 24px;font-size:14px;}

  label{display:block;font-family:var(--heading-font);font-weight:700;font-size:13px;letter-spacing:normal;margin-bottom:6px;color:#d6e6f2;}
  .req{color:var(--red);}
  input[type=text],input[type=password],input[type=email],input[type=tel],select,textarea{
    width:100%;padding:11px 13px;background:rgba(255,255,255,0.06);
    border:1px solid var(--line);color:var(--white);font-family:inherit;font-size:15px;
    border-radius:6px;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--sky-blue);outline-offset:-2px;}
  textarea{resize:vertical;min-height:80px;}
  select option{background:var(--card-dark);color:var(--white);}
  .field{margin-bottom:18px;}
  /* Short, related fields pair up; long ones stay full width. */
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  @media (max-width:1200px){ .field-row{grid-template-columns:1fr;} }
  .btn-primary{background:var(--red);color:var(--white);padding:14px 28px;font-size:15px;width:100%;border-radius:6px;}
  .btn-primary:hover:not(:disabled){background:#a50d26;}
  .msg{margin-top:18px;padding:12px 16px;font-size:14px;display:none;border-radius:6px;}
  .msg.error{display:block;background:rgba(200,16,46,0.12);border-left:3px solid var(--red);color:#e8a0a8;}
  .msg.ok{display:block;background:rgba(43,140,196,0.12);border-left:3px solid var(--sky-blue);color:#c8dff0;}

  /* ------------------------------------------------------------ worksheet */
  /* The two panes scroll independently so the page itself never does: the
     club you are calling and the form stay put while you read either side. */
  .work{display:grid;grid-template-columns:1fr 1fr;gap:0;height:100%;min-height:0;}
  .pane{padding:24px;height:100%;overflow-y:auto;overscroll-behavior:contain;}
  .pane-left{border-right:1px solid var(--line);}

  /* Below the breakpoint the panes stack, where independent scrolling would
     trap the user in a short box — so the document scrolls normally again. */
  @media (max-width:980px){
    html,body{height:auto;overflow:auto;}
    #view-work{height:auto;}
    #work-body,#admin-body{overflow:visible;min-height:0;}
    .work{grid-template-columns:1fr;height:auto;}
    .pane{height:auto;overflow:visible;}
    .pane-left{border-right:0;border-bottom:1px solid var(--line);}
    .topbar{position:sticky;top:0;}
  }

  .club-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px;}
  .club-name{font-size:27px;line-height:1.15;margin-bottom:4px;}
  .club-sub{color:var(--muted);margin:0;font-size:14px;}
  .phone-cta{
    display:inline-block;background:var(--sky-blue);color:var(--white);text-decoration:none;
    font-family:var(--heading-font);font-weight:700;font-size:21px;letter-spacing:normal;padding:11px 22px;
    border-radius:8px;flex-shrink:0;white-space:nowrap;
  }
  .phone-cta:hover{background:#1f6f9e;}
  .phone-cta.none{background:rgba(255,255,255,0.08);color:var(--muted);pointer-events:none;font-size:14px;font-weight:400;white-space:normal;max-width:230px;}

  /* Two label/value pairs per row. minmax(0,1fr) lets long values (the
     address, the website) wrap instead of forcing the grid wider. */
  .facts{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);
         gap:8px 14px;font-size:14px;margin-bottom:22px;align-items:baseline;}
  .facts dt{color:var(--muted);white-space:nowrap;}
  .facts dd{margin:0;min-width:0;overflow-wrap:anywhere;}
  @media (max-width:1200px){
    .facts{grid-template-columns:auto minmax(0,1fr);}
  }

  /* Full-bleed across the column: negative margins cancel the pane's padding
     so the block runs edge to edge, with the padding put back inside. */
  .script{background:var(--card-dark);border:0;
          margin:0 -24px;padding:20px 24px;}
  .script h3{font-size:15px;margin-bottom:10px;color:var(--sky-blue);}
  .script .step{margin-bottom:14px;}
  .script .step:last-child{margin-bottom:0;}
  .script .step b{color:#d6e6f2;font-family:var(--heading-font);letter-spacing:normal;font-size:14px;display:block;}
  .script em{color:var(--sky-blue);font-style:normal;}

  .history{margin-top:20px;background:rgba(255,255,255,0.04);border:1px solid var(--line);padding:14px 18px;font-size:14px;}
  .history h4{font-size:13px;margin-bottom:8px;color:var(--muted);}
  .history li{margin-bottom:6px;}

  .form-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px;}
  .form-head h2{font-size:20px;}
  .checkbox{display:flex;gap:10px;align-items:flex-start;background:rgba(43,140,196,0.1);border-left:3px solid var(--sky-blue);padding:12px 14px;}
  .checkbox input{margin-top:3px;width:18px;height:18px;flex-shrink:0;accent-color:var(--sky-blue);}
  .checkbox label{margin:0;font-family:inherit;letter-spacing:0;font-size:14px;color:#c8dff0;line-height:1.5;}
  .actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;}
  .actions .btn-primary{width:auto;flex:1;min-width:180px;}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--muted);padding:14px 20px;font-size:14px;font-weight:400;border-radius:6px;}
  .btn-ghost:hover:not(:disabled){border-color:var(--sky-blue);color:var(--white);}

  /* ---------------------------------------------------------- admin view */
  /* One segmented control, not two buttons: a single track with the active
     half filled, so it reads as a state switch rather than two actions. */
  .tabs{display:inline-flex;background:rgba(255,255,255,0.07);border-radius:999px;padding:3px;gap:0;}
  .tab{background:none;border:0;color:var(--muted);padding:7px 20px;font-size:13px;
       border-radius:999px;transition:background 0.15s,color 0.15s;}
  .tab:hover:not(.on){color:var(--white);}
  .tab.on{background:var(--sky-blue);color:var(--white);}
  .admin{padding:24px;max-width:1400px;}
  .admin h2{font-size:17px;margin:30px 0 12px;}
  .admin h2:first-child{margin-top:0;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .card{background:var(--card-dark);border:0;border-radius:10px;padding:16px 18px;}
  .card b{display:block;font-family:var(--heading-font);font-weight:700;font-size:28px;line-height:1;margin-bottom:5px;}
  .card span{color:var(--muted);font-size:13px;}
  .card.warn{box-shadow:inset 0 0 0 1px var(--red);}
  .card.warn b{color:#e8a0a8;}
  .card.good{box-shadow:inset 0 0 0 1px rgba(43,140,196,0.6);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:0;}
  th{font-family:var(--heading-font);letter-spacing:normal;color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap;}
  tbody tr:hover{background:rgba(255,255,255,0.03);}
  /* Rounded, borderless table shell. overflow:hidden clips the first and last
     rows to the corner radius; the row separators are kept. */
  .scroll{overflow-x:auto;border:0;border-radius:10px;background:var(--card-dark);}
  .pill{display:inline-block;padding:2px 9px;font-size:12px;background:rgba(255,255,255,0.09);white-space:nowrap;border-radius:20px;}
  .pill.ok{background:rgba(43,140,196,0.22);color:#c8dff0;}
  .pill.bad{background:rgba(200,16,46,0.22);color:#e8a0a8;}
  .banner{padding:14px 18px;margin-bottom:16px;font-size:14px;border-radius:10px;}
  .banner.ok{background:rgba(43,140,196,0.12);border-left:3px solid var(--sky-blue);color:#c8dff0;}
  .banner.bad{background:rgba(200,16,46,0.12);border-left:3px solid var(--red);color:#e8a0a8;}
  .nowrap{white-space:nowrap;}

  /* ------------------------------------------------------------- charts */
  .panel{background:var(--card-dark);border-radius:10px;padding:22px 24px;}
  .chart-empty{color:var(--muted);font-size:14px;}
  .chart-row{display:flex;gap:34px;align-items:center;flex-wrap:wrap;}
  .legend{list-style:none;margin:0;padding:0;flex:1 1 320px;min-width:280px;}
  .legend li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px;}
  .swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
  .lg-label{flex:1 1 auto;}
  .lg-val{font-weight:700;white-space:nowrap;}
  .lg-pct{color:var(--muted);font-weight:400;margin-left:6px;}

  .funnel{list-style:none;margin:0;padding:0;}
  .funnel li{margin-bottom:18px;}
  .funnel li:last-child{margin-bottom:0;}
  .fn-head{display:flex;align-items:baseline;gap:10px;margin-bottom:7px;flex-wrap:wrap;}
  .fn-step{width:21px;height:21px;border-radius:50%;background:rgba(255,255,255,0.1);
           color:var(--muted);font-size:12px;display:inline-flex;align-items:center;
           justify-content:center;flex-shrink:0;align-self:center;}
  .fn-label{font-weight:700;}
  .fn-hint{color:var(--muted);font-size:13px;flex:1 1 auto;}
  .fn-num{font-weight:700;font-size:17px;white-space:nowrap;}
  .fn-pct{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px;}
  .fn-track{background:rgba(255,255,255,0.07);border-radius:999px;height:9px;overflow:hidden;}
  .fn-bar{background:var(--sky-blue);height:100%;border-radius:999px;min-width:0;}
  .funnel li:last-child .fn-bar{background:#3fbf6f;}
  .fn-note{color:var(--muted);font-size:13px;margin:18px 0 0;}

  .empty{padding:80px 24px;text-align:center;}
  .empty h2{font-size:24px;margin-bottom:10px;}
  .empty p{color:var(--muted);}
  .hidden{display:none !important;}
</style>
</head>
<body>

<!-- ============================================================== LOGIN -->
<div class="auth-wrap" id="view-login">
  <div class="auth">
    <h1>Call worksheet</h1>
    <p class="sub">Darwin 1942 &mdash; RSL club outreach</p>
    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Log in</button>
      <div class="msg" id="login-msg"></div>
    </form>
  </div>
</div>

<!-- ============================================================== SETUP -->
<div class="auth-wrap hidden" id="view-setup">
  <div class="auth">
    <h1>Set your password</h1>
    <p class="sub" id="setup-sub">&nbsp;</p>
    <form id="setup-form">
      <div class="field">
        <label for="new-password">New password <span class="req">*</span></label>
        <input type="password" id="new-password" autocomplete="new-password" minlength="10" required>
        <p style="color:var(--muted);font-size:13px;margin:6px 0 0;">At least 10 characters. Nobody else ever sees this, including Taylor.</p>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm password <span class="req">*</span></label>
        <input type="password" id="confirm-password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn-primary" id="setup-btn">Save password</button>
      <div class="msg" id="setup-msg"></div>
    </form>
  </div>
</div>

<!-- ========================================================== WORKSHEET -->
<div class="hidden" id="view-work">
  <div class="topbar">
    <div>
      <h1>Call worksheet</h1>
      <div class="who"><span id="who-name"></span> &middot; <button class="linkbtn" id="logout-btn">log out</button></div>
    </div>
    <div class="tabs hidden" id="admin-tabs">
      <button class="tab on" id="tab-work">Worksheet</button>
      <button class="tab" id="tab-admin">Overview</button>
    </div>
    <div class="counters">
      <div><b id="c-mine">0</b> my calls</div>
      <div><b id="c-remaining">0</b> left to call</div>
      <div><b id="c-done">0</b> done</div>
      <div><b id="c-dnc">0</b> do not call</div>
    </div>
  </div>

  <div id="work-body"></div>
  <div id="admin-body" class="hidden"></div>
</div>

<script>
(function(){
  "use strict";

  var API = "https://nwchcduhlhhppvyhxbpo.supabase.co/functions/v1/d1942-calls-api";
  var TOKEN_KEY = "d1942_calls_token";

  var token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch(e){}
  var current = null; // the club currently on screen

  function api(action, payload){
    var body = Object.assign({ action: action }, payload || {});
    if (token) body.token = token;
    return fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function(r){
      return r.json().then(function(j){
        if (r.status === 401) { signOut(); throw new Error("Your session expired. Please log in again."); }
        if (j && j.error) throw new Error(j.error);
        return j;
      });
    });
  }

  function show(id){
    ["view-login","view-setup","view-work"].forEach(function(v){
      document.getElementById(v).classList.toggle("hidden", v !== id);
    });
  }
  function msg(el, text, kind){
    var n = document.getElementById(el);
    n.className = "msg " + (kind || "error");
    n.textContent = text;
  }
  function clearMsg(el){ document.getElementById(el).className = "msg"; }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  // ----------------------------------------------------------- setup flow
  var setupToken = new URLSearchParams(location.search).get("setup");

  if (setupToken) {
    show("view-setup");
    api("setup_check", { setup_token: setupToken }).then(function(r){
      if (!r.valid) { msg("setup-msg", r.reason, "error"); document.getElementById("setup-btn").disabled = true; return; }
      document.getElementById("setup-sub").textContent =
        r.name + " — your username is " + r.username;
      if (r.already_set) msg("setup-msg", "You already have a password. Saving here replaces it.", "ok");
    }).catch(function(e){ msg("setup-msg", e.message, "error"); });

    document.getElementById("setup-form").addEventListener("submit", function(e){
      e.preventDefault();
      clearMsg("setup-msg");
      var pw = document.getElementById("new-password").value;
      var cf = document.getElementById("confirm-password").value;
      if (pw !== cf) { msg("setup-msg", "Those two passwords do not match.", "error"); return; }
      var btn = document.getElementById("setup-btn");
      btn.disabled = true; btn.textContent = "Saving...";
      api("setup", { setup_token: setupToken, password: pw }).then(function(){
        msg("setup-msg", "Password saved. Taking you to the login screen...", "ok");
        setTimeout(function(){ location.href = location.pathname; }, 1400);
      }).catch(function(err){
        msg("setup-msg", err.message, "error");
        btn.disabled = false; btn.textContent = "Save password";
      });
    });
    return;
  }

  // ----------------------------------------------------------- login flow
  document.getElementById("login-form").addEventListener("submit", function(e){
    e.preventDefault();
    clearMsg("login-msg");
    var btn = document.getElementById("login-btn");
    btn.disabled = true; btn.textContent = "Logging in...";
    api("login", {
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    }).then(function(r){
      if (r.error) throw new Error(r.error);
      token = r.token;
      try { localStorage.setItem(TOKEN_KEY, token); } catch(e){}
      startWork(r.caller);
    }).catch(function(err){
      msg("login-msg", err.message, "error");
      btn.disabled = false; btn.textContent = "Log in";
    });
  });

  function signOut(){
    token = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch(e){}
    show("view-login");
    var btn = document.getElementById("login-btn");
    btn.disabled = false; btn.textContent = "Log in";
  }

  document.getElementById("logout-btn").addEventListener("click", function(){
    api("logout", {}).catch(function(){});
    signOut();
  });

  function startWork(caller){
    document.getElementById("who-name").textContent = caller.name;
    show("view-work");
    if (caller.is_admin) {
      document.getElementById("admin-tabs").classList.remove("hidden");
      document.getElementById("tab-work").addEventListener("click", function(){ switchTab("work"); });
      document.getElementById("tab-admin").addEventListener("click", function(){ switchTab("admin"); });
    }
    loadNext();
  }

  function switchTab(which){
    var isAdmin = which === "admin";
    document.getElementById("tab-work").classList.toggle("on", !isAdmin);
    document.getElementById("tab-admin").classList.toggle("on", isAdmin);
    document.getElementById("work-body").classList.toggle("hidden", isAdmin);
    document.getElementById("admin-body").classList.toggle("hidden", !isAdmin);
    if (isAdmin) loadOverview();
  }

  // --------------------------------------------------------------- overview
  function loadOverview(){
    var el = document.getElementById("admin-body");
    el.innerHTML = '<div class="empty"><p>Loading overview...</p></div>';
    api("overview", {}).then(function(d){ renderOverview(el, d); }).catch(function(e){
      el.innerHTML = '<div class="empty"><h2>Could not load</h2><p>' + esc(e.message) + "</p></div>";
    });
  }

  // Distinguishable on the dark ground and stable per outcome, so a slice keeps
  // its colour as the numbers move. Sequential greens/ambers/reds roughly track
  // good -> neutral -> dead, which makes the pie readable without the legend.
  var OUTCOME_COLOURS = {
    committed:           "#3fbf6f",
    interested_followup: "#2b8cc4",
    referred_to_board:   "#5fa8d8",
    callback_scheduled:  "#7fc4e8",
    wants_updates:       "#d8a33f",
    wants_info_only:     "#c4883f",
    not_interested:      "#c8102e",
    no_answer:           "#6b7f8f",
    gatekeeper:          "#55606b",
    wrong_number:        "#3f4a54"
  };
  var OUTCOME_LABELS = {
    committed:           "Committed",
    interested_followup: "Interested \u2014 needs another call",
    referred_to_board:   "Going to the board",
    callback_scheduled:  "Callback scheduled",
    wants_updates:       "Wants updates only",
    wants_info_only:     "Wants information only",
    not_interested:      "Not interested",
    no_answer:           "No answer",
    gatekeeper:          "Blocked at reception",
    wrong_number:        "Wrong number"
  };
  function outcomeColour(k){ return OUTCOME_COLOURS[k] || "#8fa3b3"; }
  function outcomeLabel(k){ return OUTCOME_LABELS[k] || String(k).replace(/_/g," "); }

  // Hand-rolled SVG donut: no chart library, so nothing external to load.
  function pieChart(byOutcome){
    var keys = Object.keys(byOutcome || {}).filter(function(k){ return byOutcome[k] > 0; });
    var total = keys.reduce(function(a,k){ return a + byOutcome[k]; }, 0);
    if (!total) {
      return '<div class="chart-empty">No calls recorded yet &mdash; the outcome mix will appear here.</div>';
    }
    keys.sort(function(a,b){ return byOutcome[b] - byOutcome[a]; });

    var cx = 110, cy = 110, r = 100, inner = 58, angle = -Math.PI / 2, paths = "";
    keys.forEach(function(k){
      var frac = byOutcome[k] / total;
      // A single slice covering everything cannot be drawn as an arc (start and
      // end coincide), so draw it as a ring instead.
      if (frac >= 0.9999) {
        paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((r + inner) / 2) + '" fill="none" ' +
                 'stroke="' + outcomeColour(k) + '" stroke-width="' + (r - inner) + '"></circle>';
        return;
      }
      var end = angle + frac * Math.PI * 2;
      var large = frac > 0.5 ? 1 : 0;
      var x1 = cx + r * Math.cos(angle),     y1 = cy + r * Math.sin(angle);
      var x2 = cx + r * Math.cos(end),       y2 = cy + r * Math.sin(end);
      var x3 = cx + inner * Math.cos(end),   y3 = cy + inner * Math.sin(end);
      var x4 = cx + inner * Math.cos(angle), y4 = cy + inner * Math.sin(angle);
      paths += '<path d="M' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
               ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2) +
               ' L' + x3.toFixed(2) + ' ' + y3.toFixed(2) +
               ' A' + inner + ' ' + inner + ' 0 ' + large + ' 0 ' + x4.toFixed(2) + ' ' + y4.toFixed(2) +
               ' Z" fill="' + outcomeColour(k) + '"></path>';
      angle = end;
    });

    var legend = keys.map(function(k){
      var n = byOutcome[k], pct = Math.round((n / total) * 100);
      return '<li><span class="swatch" style="background:' + outcomeColour(k) + '"></span>' +
             '<span class="lg-label">' + esc(outcomeLabel(k)) + "</span>" +
             '<span class="lg-val">' + n + ' <span class="lg-pct">' + pct + "%</span></span></li>";
    }).join("");

    return '<div class="chart-row">' +
             '<svg viewBox="0 0 220 220" width="200" height="200" role="img" ' +
                  'aria-label="Call outcomes as a proportion of all calls">' + paths +
               '<text x="110" y="104" text-anchor="middle" fill="#ffffff" font-size="30" font-family="Arial" font-weight="bold">' + total + "</text>" +
               '<text x="110" y="126" text-anchor="middle" fill="#a8c4d8" font-size="12" font-family="Arial">calls</text>' +
             "</svg>" +
             '<ul class="legend">' + legend + "</ul>" +
           "</div>";
  }

  // Horizontal stage timeline. Bars are scaled against the widest stage rather
  // than the club total, so the later, smaller stages stay readable.
  function funnelChart(f, totalClubs){
    var stages = [
      { key:"waiting",     label:"Waiting to be called", hint:"never rung" },
      { key:"called_once", label:"Called",               hint:"spoke to someone" },
      { key:"into_cio",    label:"Into Customer.io",     hint:"sent the pack" },
      { key:"second_call", label:"Second call",          hint:"a later round" },
      { key:"committed",   label:"Committed money",      hint:"agreed a package" }
    ];
    var max = stages.reduce(function(m,st){ return Math.max(m, Number(f[st.key] || 0)); }, 0) || 1;

    return '<ol class="funnel">' + stages.map(function(st, i){
      var n = Number(f[st.key] || 0);
      var pctOfMax = Math.max((n / max) * 100, n > 0 ? 3 : 0);
      var pctOfAll = totalClubs ? Math.round((n / totalClubs) * 100) : 0;
      return "<li>" +
               '<div class="fn-head"><span class="fn-step">' + (i + 1) + "</span>" +
                 '<span class="fn-label">' + esc(st.label) + "</span>" +
                 '<span class="fn-hint">' + esc(st.hint) + "</span>" +
                 '<span class="fn-num">' + n + '<span class="fn-pct">' + pctOfAll + "% of clubs</span></span></div>" +
               '<div class="fn-track"><div class="fn-bar" style="width:' + pctOfMax.toFixed(1) + '%"></div></div>' +
             "</li>";
    }).join("") + "</ol>";
  }

  function card(value, label, cls){
    return '<div class="card ' + (cls || "") + '"><b>' + esc(value) + "</b><span>" + esc(label) + "</span></div>";
  }
  function when(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleDateString("en-AU") + " " + d.toLocaleTimeString("en-AU", {hour:"2-digit", minute:"2-digit"});
  }
  function yesno(v){ return v ? '<span class="pill ok">yes</span>' : '<span class="pill">no</span>'; }

  function renderOverview(el, d){
    var c = d.counters, dl = d.delivery;
    var undelivered = dl.unsynced_sheet + dl.unsynced_cio;

    // Delivery is the guarantee that matters most, so it leads.
    var banner = undelivered === 0
      ? '<div class="banner ok">Every recorded call has reached the spreadsheet and Customer.io. Nothing is outstanding.</div>'
      : '<div class="banner bad"><b>' + undelivered + ' call(s) not yet delivered.</b> ' +
        'They are safely recorded in Supabase and the sweeper retries every 5 minutes — no data is lost. ' +
        'Details below.</div>';

    var failing = "";
    if (d.failing && d.failing.length) {
      failing =
        "<h2>Awaiting delivery</h2><div class='scroll'><table><thead><tr>" +
        "<th>Club</th><th>Recorded</th><th>Sheet tries</th><th>Sheet error</th><th>CIO tries</th><th>CIO error</th>" +
        "</tr></thead><tbody>" +
        d.failing.map(function(f){
          return "<tr><td>" + esc(f.club) + '</td><td class="nowrap">' + esc(when(f.created_at)) + "</td>" +
                 "<td>" + esc(f.sheet_attempts) + "</td><td>" + esc(f.sheet_error || "—") + "</td>" +
                 "<td>" + esc(f.cio_attempts) + "</td><td>" + esc(f.cio_error || "—") + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }

    var outcomeHtml =
      '<h2>Outcome of every call</h2><div class="panel">' + pieChart(d.by_outcome) + "</div>" +
      '<h2>Where the clubs are up to</h2><div class="panel">' +
        funnelChart(d.funnel || {}, c.total) +
        '<p class="fn-note">Every club counted once, at each stage it has reached. ' +
        'Attempts that reached nobody (no answer, reception, wrong number) do not count as a call. ' +
        esc(c.do_not_call) + ' club(s) are excluded as do-not-call.</p>' +
      "</div>";

    el.innerHTML =
      '<div class="admin">' +
        banner +

        "<h2>Progress</h2>" +
        '<div class="cards">' +
          card(c.total, "clubs on the list") +
          card(c.done, "called", "good") +
          card(c.pending, "still to call") +
          card(c.in_progress, "on a call now") +
          card(c.do_not_call, "do not call") +
          card(c.calls, "calls recorded") +
          card(c.wants_info, "asked for info") +
        "</div>" +

        outcomeHtml +

        "<h2>Callers</h2><div class='scroll'><table><thead><tr>" +
          "<th>Name</th><th>Username</th><th>Calls</th><th>On a call</th><th>Password set</th><th>Last login</th>" +
        "</tr></thead><tbody>" +
        (d.callers.length
          ? d.callers.map(function(x){
              return "<tr><td>" + esc(x.name) + (x.is_admin ? ' <span class="pill">admin</span>' : "") + "</td>" +
                     "<td>" + esc(x.username) + "</td><td>" + esc(x.calls) + "</td><td>" + esc(x.assigned_now) + "</td>" +
                     "<td>" + (x.password_set ? '<span class="pill ok">yes</span>'
                                              : '<span class="pill bad">setup link not used</span>') + "</td>" +
                     '<td class="nowrap">' + esc(when(x.last_login_at)) + "</td></tr>";
            }).join("")
          : '<tr><td colspan="6">No callers set up yet.</td></tr>') +
        "</tbody></table></div>" +

        "<h2>Recent calls</h2><div class='scroll'><table><thead><tr>" +
          "<th>When</th><th>Club</th><th>Caller</th><th>Outcome</th><th>Decision maker</th>" +
          "<th>Wants info</th><th>In sheet</th><th>Notes</th>" +
        "</tr></thead><tbody>" +
        (d.recent.length
          ? d.recent.map(function(r){
              return '<tr><td class="nowrap">' + esc(when(r.created_at)) + "</td>" +
                     "<td>" + esc(r.club) + "<br><span style='color:var(--muted)'>" + esc(r.where) + "</span></td>" +
                     "<td>" + esc(r.caller) + "</td>" +
                     "<td>" + esc((r.outcome||"").replace(/_/g," ")) + (r.round>1 ? " (call "+esc(r.round)+")" : "") + "</td>" +
                     "<td>" + esc(r.decision_maker || "—") +
                       (r.decision_maker_role ? "<br><span style='color:var(--muted)'>"+esc(r.decision_maker_role)+"</span>" : "") +
                       (r.decision_maker_email ? "<br>"+esc(r.decision_maker_email) : "") + "</td>" +
                     "<td>" + yesno(r.wants_info) + "</td>" +
                     "<td>" + (r.sheet_synced ? '<span class="pill ok">yes</span>' : '<span class="pill bad">pending</span>') + "</td>" +
                     "<td>" + esc(r.notes || "—") + "</td></tr>";
            }).join("")
          : '<tr><td colspan="8">No calls recorded yet.</td></tr>') +
        "</tbody></table></div>" +

        failing +

        "<h2>Do not call &mdash; already came to us</h2><div class='scroll'><table><thead><tr>" +
          "<th>Club</th><th>Where</th><th>Why</th>" +
        "</tr></thead><tbody>" +
        (d.do_not_call.length
          ? d.do_not_call.map(function(x){
              return "<tr><td>" + esc(x.entity_name) + "</td><td>" +
                     esc([x.suburb, x.state].filter(Boolean).join(" ")) + "</td><td>" +
                     esc(x.do_not_call_reason || "—") + "</td></tr>";
            }).join("")
          : '<tr><td colspan="3">Nothing flagged yet.</td></tr>') +
        "</tbody></table></div>" +
      "</div>";
  }

  function setStats(s){
    if (!s) return;
    document.getElementById("c-mine").textContent = s.my_calls;
    document.getElementById("c-remaining").textContent = s.remaining;
    document.getElementById("c-done").textContent = s.done;
    document.getElementById("c-dnc").textContent = s.do_not_call;
  }

  // ------------------------------------------------------------ worksheet
  function loadNext(){
    document.getElementById("work-body").innerHTML =
      '<div class="empty"><p>Finding your next club...</p></div>';
    api("next", {}).then(function(r){
      setStats(r.stats);
      current = r.target;
      if (!r.target) {
        document.getElementById("work-body").innerHTML =
          '<div class="empty"><h2>Nothing left to call</h2>' +
          '<p>Every club in your queue has been called. Check back after the next round opens.</p></div>';
        return;
      }
      render(r.target, r.history || []);
    }).catch(function(e){
      document.getElementById("work-body").innerHTML =
        '<div class="empty"><h2>Something went wrong</h2><p>' + esc(e.message) + '</p></div>';
    });
  }

  function fact(label, value){
    if (!value && value !== 0) return "";
    return "<dt>" + esc(label) + "</dt><dd>" + esc(value) + "</dd>";
  }

  function money(v){ return v ? String(v) : ""; }

  function render(t, history){
    var phone = (t.primary_phone || "").trim();
    var telHref = phone ? "tel:" + phone.replace(/[^0-9+]/g, "") : "";
    var firstName = (t.primary_person || "").split(" ")[0] || "";

    var websites = (t.websites || "").split(";")[0].trim();

    var historyHtml = "";
    if (history.length) {
      historyHtml =
        '<div class="history"><h4>Previous contact</h4><ul>' +
        history.map(function(h){
          var when = h.created_at ? new Date(h.created_at).toLocaleDateString("en-AU") : "";
          var who = (h.d1942_callers && h.d1942_callers.name) || "";
          return "<li><b>" + esc(when) + "</b> " + esc(who) + " &mdash; " + esc(h.outcome || "") +
                 (h.decision_maker_name ? " (spoke to " + esc(h.decision_maker_name) + ")" : "") +
                 (h.notes ? "<br>" + esc(h.notes) : "") + "</li>";
        }).join("") +
        "</ul></div>";
    }

    var html =
    '<div class="work">' +

      // -------------------------------------------------- left: who + script
      '<div class="pane pane-left">' +
        '<div class="club-head">' +
          "<div>" +
            '<h2 class="club-name">' + esc(t.entity_name) + "</h2>" +
            '<p class="club-sub">' + esc([t.suburb, t.state, t.postcode].filter(Boolean).join(" ")) + "</p>" +
          "</div>" +
          (phone
            ? '<a class="phone-cta" href="' + esc(telHref) + '">' + esc(phone) + "</a>"
            : '<span class="phone-cta none">No phone number on file &mdash; try the website</span>') +
        "</div>" +

        '<dl class="facts">' +
          fact("Address", t.full_address) +
          fact("Contact on file", t.primary_person) +
          fact("Email on file", t.primary_email) +
          fact("Gaming machines", t.egm_count) +
          fact("Gaming revenue", money(t.gaming_revenue)) +
          fact("State profit rank", t.gaming_rank) +
          fact("Distance from Sydney", t.distance_km ? t.distance_km + " km" : "") +
          (websites ? "<dt>Website</dt><dd><a href='" + esc(websites) + "' target='_blank' rel='noopener'>" + esc(websites) + "</a></dd>" : "") +
        "</dl>" +

        // The script is deliberately plain HTML you can edit in this file.
        '<div class="script">' +
          "<h3>Call script</h3>" +

          '<div class="step"><b>1. Opening</b>' +
            'Hi, it’s <em>[your name]</em> calling from the Darwin 1942 documentary team. ' +
            'Could I speak with ' + (firstName ? "<em>" + esc(firstName) + "</em>, or " : "") +
            'whoever looks after community partnerships or sponsorship at ' + esc(t.entity_name) + "?</div>" +

          '<div class="step"><b>2. Why we are calling</b>' +
            'We’re making <em>Darwin 1942 &mdash; The Forgotten War That Reshaped Australia</em>, a commemorative ' +
            'documentary about the bombing of Darwin and the Veterans who defended it. ' +
            'We’re partnering with RSL clubs and sub branches around the country to bring it to their communities.</div>' +

          '<div class="step"><b>3. What it means for the club</b>' +
            'For clubs that come on board it’s unlimited community screenings for up to 10 years, ' +
            'a digital watch-at-home gift for members, copies for local schools, and a member ' +
            'engagement and growth campaign built around the film. ' +
            'It’s designed to honour Veterans and bring people back through the doors.</div>' +

          '<div class="step"><b>4. Qualify &mdash; fill the form as you go</b>' +
            'Who would be the right person to make a decision like this? &middot; ' +
            'Does the club run ClubGRANTS or a community funding round? &middot; ' +
            'Who else would be involved in a decision? &middot; ' +
            'When does the board or committee next meet?</div>' +

          '<div class="step"><b>5. Close</b>' +
            'Can I email you the partnership presentation so you have it in front of you before ' +
            'that meeting? &mdash; then tick <em>send more information</em> and take their email.</div>' +

          '<div class="step"><b>If they push back on money</b>' +
            'Completely understand — nothing has to be decided today. Can I keep you posted as ' +
            'the film progresses? Choose the <em>wants updates</em> outcome.</div>' +
        "</div>" +

        historyHtml +
      "</div>" +

      // ------------------------------------------------------- right: form
      '<div class="pane">' +
        '<div class="form-head"><h2>Record the call</h2></div>' +
        '<form id="call-form">' +
          '<div class="field-row">' +
            '<div class="field"><label for="f-dm">Who is the appropriate decision maker?</label>' +
              '<input type="text" id="f-dm" autocomplete="off"></div>' +
            '<div class="field"><label for="f-role">What is their role?</label>' +
              '<input type="text" id="f-role" autocomplete="off"></div>' +
          "</div>" +
          '<div class="field-row">' +
            '<div class="field"><label for="f-email">Their direct email</label>' +
              '<input type="email" id="f-email" autocomplete="off"></div>' +
            '<div class="field"><label for="f-phone">Their direct phone number</label>' +
              '<input type="tel" id="f-phone" autocomplete="off"></div>' +
          "</div>" +
          '<div class="field-row">' +
            '<div class="field"><label for="f-grants">Does the club participate in ClubGRANTS / community funding?</label>' +
              '<input type="text" id="f-grants" autocomplete="off" placeholder="Yes / No / details"></div>' +
            '<div class="field"><label for="f-others">Who else is involved in the decision?</label>' +
              '<input type="text" id="f-others" autocomplete="off"></div>' +
          "</div>" +
          '<div class="field"><label for="f-board">When does the relevant committee or board meet?</label>' +
            '<input type="text" id="f-board" autocomplete="off" placeholder="e.g. third Tuesday monthly, next 18 Sept"></div>' +

          '<div class="field checkbox">' +
            '<input type="checkbox" id="f-wants">' +
            '<label for="f-wants">They want to receive more information &mdash; add them to Customer.io and send the partnership pack. Needs their email address above.</label>' +
          "</div>" +

          '<div class="field" style="margin-top:18px;"><label for="f-notes">Any other notes on how the call went</label>' +
            '<textarea id="f-notes" rows="4"></textarea></div>' +

          '<div class="field"><label for="f-outcome">Outcome <span class="req">*</span></label>' +
            '<select id="f-outcome" required>' +
              '<option value="">Choose an outcome...</option>' +
              '<option value="interested_followup">Seems interested &mdash; needs another call</option>' +
              '<option value="referred_to_board">Going to the board / committee</option>' +
              '<option value="callback_scheduled">Callback scheduled</option>' +
              '<option value="wants_updates">Not ready to commit financially &mdash; wants updates on the project</option>' +
              '<option value="wants_info_only">Wants information only</option>' +
              '<option value="committed">Committed &mdash; agreed to a package</option>' +
              '<option value="not_interested">Not interested</option>' +
              '<option value="no_answer">No answer / voicemail</option>' +
              '<option value="gatekeeper">Could not get past reception</option>' +
              '<option value="wrong_number">Wrong number / bad contact details</option>' +
            "</select>" +
            '<p style="color:var(--muted);font-size:13px;margin:6px 0 0;">No answer, reception and wrong number put the club back in the pool to try again later. Everything else marks it called.</p>' +
          "</div>" +

          '<div class="actions">' +
            '<button type="submit" class="btn-primary" id="save-btn">Done &mdash; save and next</button>' +
            '<button type="button" class="btn-ghost" id="skip-btn">Skip for now</button>' +
          "</div>" +
          '<div class="msg" id="save-msg"></div>' +
        "</form>" +
      "</div>" +
    "</div>";

    document.getElementById("work-body").innerHTML = html;

    document.getElementById("call-form").addEventListener("submit", onSave);
    document.getElementById("skip-btn").addEventListener("click", function(){
      if (!current) return;
      var b = this; b.disabled = true;
      api("skip", { target_id: current.id }).then(loadNext).catch(function(e){
        msg("save-msg", e.message, "error"); b.disabled = false;
      });
    });
  }

  function onSave(e){
    e.preventDefault();
    if (!current) return;
    clearMsg("save-msg");

    var wants = document.getElementById("f-wants").checked;
    var email = document.getElementById("f-email").value.trim();
    if (wants && !email) {
      msg("save-msg", "To send more information you need their email address.", "error");
      document.getElementById("f-email").focus();
      return;
    }

    var btn = document.getElementById("save-btn");
    btn.disabled = true; btn.textContent = "Saving...";

    api("save", {
      target_id: current.id,
      decision_maker_name:  document.getElementById("f-dm").value,
      decision_maker_role:  document.getElementById("f-role").value,
      decision_maker_email: email,
      decision_maker_phone: document.getElementById("f-phone").value,
      clubgrants:           document.getElementById("f-grants").value,
      others_involved:      document.getElementById("f-others").value,
      board_meeting:        document.getElementById("f-board").value,
      wants_info:           wants,
      notes:                document.getElementById("f-notes").value,
      outcome:              document.getElementById("f-outcome").value
    }).then(function(){
      loadNext();
    }).catch(function(err){
      msg("save-msg", err.message, "error");
      btn.disabled = false; btn.textContent = "Done — save and next";
    });
  }

  // Warn before losing anything typed into the form.
  window.addEventListener("beforeunload", function(e){
    if (!current) return;
    var form = document.getElementById("call-form");
    if (!form) return;
    var dirty = ["f-dm","f-role","f-email","f-phone","f-grants","f-others","f-board","f-notes"]
      .some(function(id){ var n = document.getElementById(id); return n && n.value.trim(); });
    if (dirty) { e.preventDefault(); e.returnValue = ""; }
  });

  // ------------------------------------------------------- resume session
  if (token) {
    api("me", {}).then(function(r){
      setStats(r.stats);
      startWork(r.caller);
    }).catch(function(){ signOut(); });
  } else {
    show("view-login");
  }
})();
</script>
</body>
</html>
