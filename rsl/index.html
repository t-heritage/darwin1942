<meta name="robots" content="noindex, nofollow">
<script>
// Old .html links still resolve (GitHub Pages serves the same file for both
// /page and /page.html), so a redirect stub in this file would point at itself.
// Instead, rewrite the address bar to the canonical extensionless URL — same
// page, no extra request, and anything copied from the bar is the clean form.
(function(){
  var p = location.pathname;
  if (!/\.html$/.test(p) || !window.history || !history.replaceState) return;
  var clean = p.replace(/\/index\.html$/, "/").replace(/\.html$/, "");
  if (clean !== p) history.replaceState(null, "", clean + location.search + location.hash);
})();
</script>

</style>

<body>

<iframe src="assets/darwin1942-rsl-presentation.pdf" title="Darwin 1942 RSL Partnership Presentation" id="rsl-pdf-frame"></iframe>
<div class="pdf-fallback" id="rsl-pdf-fallback">
  <p>Your browser can't preview the PDF here.</p>
  <a href="assets/darwin1942-rsl-presentation.pdf" target="_blank" rel="noopener">DOWNLOAD THE PRESENTATION (PDF)</a>
</div>

<script>
(function(){
  // Mobile Safari and some in-app browsers (Slack, Instagram, etc.) can't render
  // PDFs inside an iframe. Detect and swap to the download fallback.
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) {
    var frame = document.getElementById('rsl-pdf-frame');
    var fallback = document.getElementById('rsl-pdf-fallback');
    if (frame && fallback) {
      frame.style.display = 'none';
      fallback.style.display = 'flex';
    }
  }
})();
</script>
