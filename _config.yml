# Jekyll config for GitHub Pages.
# The site is plain HTML; Jekyll is only used to build the media releases
# (Markdown files in _releases, written through the editor at /admin/) and the
# news-and-media page (which reads its items from a published Google Sheet).
# Files without front matter are copied through untouched, so the existing
# pages are unaffected by this file.
title: Darwin 1942
description: Darwin 1942 is a feature-length commemorative documentary honouring the WW2 Veterans who defended Australian soil, marking the 85th anniversary of the Bombing of Darwin.
url: https://darwin1942.com
timezone: Australia/Sydney
future: true

# /news-and-media/ is built from a Google Sheet published to the web as CSV.
# Paste the published CSV address between the quotes (File > Share > Publish to web >
# the News tab > Comma-separated values). Left empty, the page shows a placeholder.
# Setup and column names: /news-and-media/README.md
news_csv_url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTtwZZ5-fdK6U6BFebpI2bQ-OvN1uCSXDPiNpbbTy1DJ0oLc6NQWPJ6_cilTzA75xrXY3d72vcD1AQV/pub?gid=2080926063&single=true&output=csv"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

collections:
  releases:
    output: true
    permalink: /media-releases/:title/

defaults:
  - scope:
      path: ""
      type: releases
    values:
      layout: release

exclude:
  - README.md
  - media-releases/README.md
  - news-and-media/README.md
  - news-and-media/news-template.csv
  - node_modules
  - Gemfile
  - Gemfile.lock
  - vendor
